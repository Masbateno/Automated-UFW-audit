[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufw-audit"
version = "1.0.3"
description = "UFW firewall audit tool — cross-checks rules against listening services"
readme = "README.md"
license = "MIT"
license-files = []
requires-python = ">=3.9"
keywords = ["ufw", "firewall", "security", "audit", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
ufw-audit = "ufw_audit.__main__:main"

[project.urls]
Homepage = "https://github.com/Masbateno/Automated-UFW-audit"
Repository = "https://github.com/Masbateno/Automated-UFW-audit"
Changelog = "https://github.com/Masbateno/Automated-UFW-audit/blob/main/DOCUMENTS/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["ufw_audit*"]

[tool.setuptools.package-data]
ufw_audit = [
    "data/*",
    "locales/*.json",
]
